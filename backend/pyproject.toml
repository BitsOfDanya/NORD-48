[project]
name = "nord48-api"
version = "0.1.0"
description = "NORD-48 backend API — satellite constellation resilience workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "networkx>=3.4",
    "scipy>=1.14",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/calculation/geometry/reference_geometry.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is not worth enforcing here.
# B008: FastAPI's Query/File/Depends(...) *must* be a call in the default,
# that's how the framework's dependency injection works.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["app/calculation/geometry/reference_geometry.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
