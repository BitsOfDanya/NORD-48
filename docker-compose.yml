name: nord48

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: NORD-48
      APP_ENV: development
      APP_DEBUG: "true"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: sqlite:///./nord48.db
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      SCENARIOS_DIR: /app/data/scenarios/raw
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  backend-venv:
